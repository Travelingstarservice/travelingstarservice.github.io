<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#c28a2c" />
    <meta name="description" content="Admin login gateway for Traveling Star Service." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/src/style.css" />
    <script src="/site-config.js"></script>
    <script src="/header-search.js" defer></script>
    <title>Admin Login | Traveling Star Service</title>
  </head>
  <body>
    <div class="flag-banner" role="img" aria-label="Traveling Star Service flag banner">
      <img src="/traveling-star-flag.jpeg" alt="Traveling Star Service flag" />
    </div>
    <header class="site-nav-wrap">
      <div class="site-search-row">
        <form class="site-search" role="search" aria-label="Site search" data-header-search>
          <input type="search" name="q" placeholder="Search services, payments, admin, contact..." aria-label="Search site" />
          <button type="submit">Search</button>
        </form>
      </div>
      <nav class="site-nav" aria-label="Primary navigation">
        <a class="brand" href="/index.html" aria-label="Traveling Star Service home">
          <img class="brand-logo" src="/traveling-star-flag.jpeg" alt="Traveling Star Service flag logo" />
          <span>Traveling Star Service</span>
        </a>
        <div class="site-nav-links">
          <a href="/services.html">Services</a>
          <a href="/ai-studio.html">AI Studio</a>
          <a href="/payments.html">Payments</a>
          <a href="/admin.html">Admin</a>
          <a href="/contact.html">Contact</a>
        </div>
      </nav>
    </header>

    <main class="subpage-shell">
      <section class="subpage-hero">
        <p class="eyebrow">Admin Login</p>
        <h1>Authorized use only.</h1>
        <p class="admin-badge">Restricted: Not accessible to customers</p>
      </section>

      <section class="panel stack" style="max-width: 520px;">
        <label class="stack">
          <span>Backend API Base</span>
          <input id="api-base" class="form-control" type="text" placeholder="https://your-backend.onrender.com/api" />
        </label>
        <button id="api-base-save-btn" class="button button-secondary button-dark" type="button">Save API Base</button>

        <label class="stack">
          <span>Admin PIN</span>
          <input id="admin-pin" class="form-control" type="password" inputmode="numeric" maxlength="4" placeholder="Enter 4-digit admin PIN" />
        </label>
        <button id="admin-login-btn" class="button button-primary" type="button">Continue to Admin Board</button>
        <p id="admin-login-note" class="admin-note">Sign in with your backend admin PIN. API base must point to your Flask backend.</p>
      </section>
    </main>

    <script>
      (function () {
        var ADMIN_TOKEN_KEY = 'tss.admin.jwt.v1';
        var ADMIN_ROLE_KEY = 'tss.admin.role.v1';
        var ADMIN_MODE_KEY = 'tss.admin.mode.v1';
        var ADMIN_LOCAL_PIN_KEY = 'tss.admin.local.pin.v1';
        var DEFAULT_LOCAL_PIN = '2580';

        var apiBaseInput = document.getElementById('api-base');
        var apiBaseSaveBtn = document.getElementById('api-base-save-btn');
        var pin = document.getElementById('admin-pin');
        var button = document.getElementById('admin-login-btn');
        var note = document.getElementById('admin-login-note');

        function isFourDigitPin(value) {
          return /^\d{4}$/.test((value || '').trim());
        }

        function setNote(message) {
          note.textContent = message;
        }

        function redirectToAdmin() {
          window.location.href = '/admin.html';
        }

        function localAdminPin() {
          return (window.localStorage.getItem(ADMIN_LOCAL_PIN_KEY) || DEFAULT_LOCAL_PIN).trim();
        }

        function storeSession(mode, token, role) {
          window.sessionStorage.setItem(ADMIN_MODE_KEY, mode);
          window.sessionStorage.setItem(ADMIN_ROLE_KEY, role || 'admin');
          if (token) {
            window.sessionStorage.setItem(ADMIN_TOKEN_KEY, token);
          } else {
            window.sessionStorage.removeItem(ADMIN_TOKEN_KEY);
          }
        }

        function signInLocally(pinValue) {
          if (pinValue !== localAdminPin()) {
            return false;
          }

          storeSession('local', '', 'admin');
          setNote('Signed in locally. Backend sync is optional. Redirecting...');
          redirectToAdmin();
          return true;
        }

        function loadInitialState() {
          var reason = new URLSearchParams(window.location.search).get('reason');
          apiBaseInput.value = window.TSSSiteConfig.getApiBase();
          setNote(reason || 'Enter your backend admin PIN to continue.');
        }

        apiBaseSaveBtn.addEventListener('click', function () {
          var nextBase = (apiBaseInput.value || '').trim();
          var normalized = window.TSSSiteConfig.setApiBase(nextBase);
          if (!normalized) {
            setNote('Enter a valid API base URL, for example https://your-backend.onrender.com/api');
            return;
          }
          apiBaseInput.value = normalized;
          setNote('API base saved: ' + normalized);
        });

        button.addEventListener('click', async function () {
          var value = (pin.value || '').trim();
          if (!isFourDigitPin(value)) {
            setNote('Please enter a valid 4-digit admin PIN.');
            return;
          }

          button.disabled = true;
          setNote('Signing in...');

          var controller = new AbortController();
          var timeoutId = setTimeout(function () {
            controller.abort();
          }, 15000);

          try {
            var response = await fetch(window.TSSSiteConfig.buildApiUrl('/auth/login'), {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                Accept: 'application/json'
              },
              body: JSON.stringify({ password: value }),
              signal: controller.signal
            });

            var payload = await response.json().catch(function () { return {}; });
            if (!response.ok) {
              if (signInLocally(value)) {
                return;
              }

              setNote(payload.error || ('Login failed (HTTP ' + response.status + ')'));
              return;
            }

            if (!payload.token || (payload.role || '').toLowerCase() !== 'admin') {
              if (signInLocally(value)) {
                return;
              }

              setNote('Admin role is required to access this board.');
              return;
            }

            storeSession('remote', payload.token, payload.role || 'admin');
            setNote('Sign-in successful. Redirecting...');
            redirectToAdmin();
          } catch (err) {
            if (signInLocally(value)) {
              return;
            }

            if (err && err.name === 'AbortError') {
              setNote('Backend is still waking up. Local sign-in is available with the saved PIN.');
            } else {
              setNote('Cannot reach backend API. Local sign-in is available with the saved PIN.');
            }
          } finally {
            clearTimeout(timeoutId);
            button.disabled = false;
          }
        });

        loadInitialState();
      })();
    </script>
  </body>
</html>
