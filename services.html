<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="description" content="Traveling Star Service offerings and route options." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/src/style.css" />
    <script src="/site-config.js"></script>
    <script src="/header-search.js" defer></script>
    <title>Services | Traveling Star Service</title>
  </head>
  <body>
    <div class="flag-banner" role="img" aria-label="Traveling Star Service flag banner">
      <img src="/traveling-star-flag.jpeg" alt="Traveling Star Service flag" />
    </div>
    <header class="site-nav-wrap">
      <div class="site-search-row">
        <form class="site-search" role="search" aria-label="Site search" data-header-search>
          <input type="search" name="q" placeholder="Search services, payments, admin, contact..." aria-label="Search site" />
          <button type="submit">Search</button>
        </form>
      </div>
      <nav class="site-nav" aria-label="Primary navigation">
        <a class="brand" href="/index.html" aria-label="Traveling Star Service home">
          <img class="brand-logo" src="/traveling-star-flag.jpeg" alt="Traveling Star Service flag logo" />
          <span>Traveling Star Service</span>
        </a>
        <div class="site-nav-links">
          <a href="/services.html">Services</a>
          <a href="/ai-studio.html">AI Studio</a>
          <a href="/payments.html">Payments</a>
          <a href="/admin.html">Admin</a>
          <a href="/contact.html">Contact</a>
        </div>
      </nav>
    </header>

    <main class="subpage-shell">
      <section class="subpage-hero">
        <p class="eyebrow">Service Catalog</p>
        <h1>Choose your route, timeline, and service style.</h1>
        <p>Call or text 252-886-5996 to confirm same-day availability and final pricing.</p>
      </section>

      <section class="grid-two" data-config-services-catalog>
      </section>

      <section class="section">
        <div class="section-heading">
          <p class="eyebrow">Fleet</p>
          <h2>Current fleet overview.</h2>
        </div>
        <div class="fleet-grid" data-config-fleet></div>
      </section>
    </main>

    <aside class="quick-contact" aria-label="Quick contact buttons">
      <a class="button button-call" href="tel:+12528865996">Call 252-886-5996</a>
      <a class="button button-text" href="sms:+12528865996?body=Hi%20Traveling%20Star%20Service%2C%20I%20need%20help%20choosing%20a%20service.">Text us</a>
    </aside>
  </body>
